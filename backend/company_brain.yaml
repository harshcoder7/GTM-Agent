products:
  - name: Pace
    short: >
      Autonomous AI employee that handles end-to-end finance and operations work —
      accounts payable (invoice → PO match → posting), vendor onboarding (collect,
      verify, route), revenue recognition, fraud checks, compliance and document
      collection — without constant prompting. Plugs into existing ERPs, email and
      spreadsheets, learns your team's process from observation and documentation,
      operates at 99%+ accuracy. Unlike chatbots or RPA, Pace proactively monitors
      systems, executes the task, and escalates only the genuine edge cases. SOC
      1/2 Type II, ISO 27001, SOX, GDPR/HIPAA compliant. Trusted by 50+ enterprises
      including DoorDash, Uber, Stripe, Mindbody, Wio Bank and Noon.
    fit_signals:
      - manual invoice processing
      - large AP / accounts payable team
      - vendor onboarding bottlenecks
      - slow month-end close
      - growing controller / finance ops headcount
      - recently raised funding
      - expanding into new markets / countries
      - regulated industry (banking, insurance, healthcare)
      - uses NetSuite / SAP / Oracle / Workday
      - finance team complaining about repetitive work
      - BPO-heavy operations
      - KYC / compliance backlog
    brochure_url: https://www.zamp.ai

target_icp: |
  Mid-market and enterprise companies (500–10,000 employees) where the finance,
  AP, procurement, or compliance team is drowning in document-heavy, repetitive
  work.

  Strongest fit signals:
  - Established controller / finance ops function — VP Finance, Controller, Head
    of Procurement, Head of Compliance, Director of AP.
  - Recent funding round, IPO prep, geographic expansion, or M&A — growth events
    that double transaction volume without doubling headcount budget.
  - Operates an ERP (NetSuite, SAP, Oracle, Workday, MS Dynamics) alongside a
    spreadsheet / email trail that humans bridge today.
  - Regulated industry (banking, fintech, insurance, healthcare, logistics) or
    marketplace business with thousands of vendors / suppliers.
  - Public job postings for AP clerks, procurement analysts, compliance ops, BPO
    managers — a tell that volume is growing manually.

  Decision-makers (who we write to):
  - VP / Head of Finance, Controller, VP / Head of FP&A
  - Head of Procurement, Head of Vendor Management
  - COO at mid-market companies
  - CFO at smaller / mid-market companies
  - Head of Compliance / Risk in regulated verticals

  Avoid: junior AP clerks (no budget), CTOs at non-fintech companies (wrong
  function), CEOs at >5000-person companies (delegation chain too long), pure
  SaaS / dev-tools startups with <100 employees, companies in active layoff
  cycles.

preferred_tone: |
  warm, consultative, peer-to-peer with senior operators — concrete and
  specific, references real public signal, never salesy or robotic

